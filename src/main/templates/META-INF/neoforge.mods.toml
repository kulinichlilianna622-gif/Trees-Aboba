modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Chqqqarkqqqq"
description='''
Compatibility between Tree Physics and Tan's Huge Trees.
Small Tan's Huge Trees trees (one-block trunk) fall with Tree Physics, huge ones stay put.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="treephysics"
    type="required"
    versionRange="[2.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tanshugetrees"
    type="optional"
    versionRange="[1.8,)"
    ordering="AFTER"
    side="BOTH"
