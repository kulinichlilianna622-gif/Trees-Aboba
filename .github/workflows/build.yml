name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trees_aboba
          path: build/libs/*.jar

      - name: Publish result to the builds branch
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
